<svg width="1024" height="1024" viewBox="0 0 100 100" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#4facfe"/>
      <stop offset="100%" stop-color="#0891b2"/>
    </linearGradient>
    <linearGradient id="pinGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#4facfe"/>
      <stop offset="100%" stop-color="#0369a1"/>
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="3" stdDeviation="3" flood-color="rgba(0,0,0,0.2)"/>
    </filter>
    <filter id="textShadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="1" stdDeviation="1" flood-color="rgba(0,0,0,0.15)"/>
    </filter>
  </defs>

  <!-- Background -->
  <rect width="100" height="100" rx="22" fill="url(#bgGrad)"/>

  <!-- Subtle inner glow top-left -->
  <circle cx="15" cy="12" r="28" fill="rgba(255,255,255,0.09)"/>

  <!-- Subtle bottom right glow -->
  <circle cx="88" cy="88" r="22" fill="rgba(0,0,0,0.08)"/>

  <!-- Location pin -->
  <path d="M50 8 C35 8 22 20 22 35 C22 52 50 76 50 76 C50 76 78 52 78 35 C78 20 65 8 50 8Z"
        fill="white" opacity="0.95" filter="url(#shadow)"/>

  <!-- Person head -->
  <circle cx="50" cy="31" r="8" fill="url(#pinGrad)"/>

  <!-- Person shoulders -->
  <path d="M38 48 C38 40 62 40 62 48" fill="url(#pinGrad)"/>

  <!-- Gaufi text -->
  <text
    x="50"
    y="91"
    font-family="Georgia, 'Times New Roman', serif"
    font-size="13"
    font-weight="700"
    fill="white"
    text-anchor="middle"
    opacity="0.95"
    filter="url(#textShadow)"
    letter-spacing="1.5"
  >Gaufi</text>

  <!-- Pin tail dot shadow -->
  <ellipse cx="50" cy="78" rx="5" ry="2" fill="rgba(0,0,0,0.12)"/>

</svg>