<svg width="1024" height="1024" viewBox="0 0 100 100" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#4facfe"/>
      <stop offset="100%" stop-color="#0891b2"/>
    </linearGradient>
    <linearGradient id="pinGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#4facfe"/>
      <stop offset="100%" stop-color="#0369a1"/>
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="3" stdDeviation="3" flood-color="rgba(0,0,0,0.2)"/>
    </filter>
  </defs>

  <!-- App icon background -->
  <rect width="100" height="100" rx="22" fill="url(#bgGrad)"/>

  <!-- Subtle inner glow circle top-left -->
  <circle cx="15" cy="15" r="30" fill="rgba(255,255,255,0.08)"/>

  <!-- Location pin shape -->
  <path d="M50 12 C36 12 24 23 24 38 C24 56 50 84 50 84 C50 84 76 56 76 38 C76 23 64 12 50 12Z"
        fill="white" opacity="0.95" filter="url(#shadow)"/>

  <!-- Person head -->
  <circle cx="50" cy="35" r="8.5" fill="url(#pinGrad)"/>

  <!-- Person shoulders -->
  <path d="M37 52 C37 44 63 44 63 52" fill="url(#pinGrad)"/>

  <!-- Pin tail dot shadow -->
  <ellipse cx="50" cy="87" rx="6" ry="2.5" fill="rgba(0,0,0,0.15)"/>
</svg>