<svg width="1024" height="1024" viewBox="0 0 100 100" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#4facfe"/>
      <stop offset="100%" stop-color="#0891b2"/>
    </linearGradient>
    <linearGradient id="pinGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#4facfe"/>
      <stop offset="100%" stop-color="#0369a1"/>
    </linearGradient>
    <filter id="pinShadow">
      <feDropShadow dx="0" dy="3" stdDeviation="3" flood-color="rgba(0,0,0,0.2)"/>
    </filter>
    <filter id="textShadow">
      <feDropShadow dx="0" dy="1" stdDeviation="1" flood-color="rgba(0,0,0,0.2)"/>
    </filter>
  </defs>

  <!-- Background -->
  <rect width="100" height="100" rx="22" fill="url(#bgGrad)"/>

  <!-- Subtle top-left glow -->
  <circle cx="12" cy="12" r="28" fill="rgba(255,255,255,0.09)"/>
  <!-- Subtle bottom-right depth -->
  <circle cx="90" cy="90" r="22" fill="rgba(0,0,0,0.08)"/>

  <!-- Location pin shape — slightly taller to fit handshake -->
  <path d="M50 7 C34 7 21 20 21 35 C21 53 50 78 50 78 C50 78 79 53 79 35 C79 20 66 7 50 7Z"
        fill="white" opacity="0.96" filter="url(#pinShadow)"/>

  <!-- Handshake inside pin -->
  <g transform="translate(50, 35)">
    <!-- Left person circle -->
    <circle cx="-14" cy="-10" r="4.5" fill="none" stroke="url(#pinGrad)" stroke-width="2.2"/>
    <!-- Right person circle -->
    <circle cx="14" cy="-10" r="4.5" fill="none" stroke="url(#pinGrad)" stroke-width="2.2"/>

    <!-- Left arm down -->
    <line x1="-14" y1="-5.5" x2="-14" y2="0" stroke="url(#pinGrad)" stroke-width="2.2" stroke-linecap="round"/>
    <!-- Right arm down -->
    <line x1="14" y1="-5.5" x2="14" y2="0" stroke="url(#pinGrad)" stroke-width="2.2" stroke-linecap="round"/>

    <!-- Left hand reaching right -->
    <line x1="-14" y1="0" x2="-2" y2="0" stroke="url(#pinGrad)" stroke-width="2.2" stroke-linecap="round"/>
    <!-- Right hand reaching left -->
    <line x1="14" y1="0" x2="2" y2="0" stroke="url(#pinGrad)" stroke-width="2.2" stroke-linecap="round"/>

    <!-- Handshake join circles -->
    <circle cx="-2" cy="0" r="3" fill="url(#pinGrad)"/>
    <circle cx="2" cy="0" r="3" fill="url(#pinGrad)"/>

    <!-- Center connection dot -->
    <circle cx="0" cy="0" r="2" fill="white"/>
  </g>

  <!-- Pin tail shadow -->
  <ellipse cx="50" cy="80" rx="5" ry="2" fill="rgba(0,0,0,0.12)"/>

  <!-- Gaufi text -->
  <text
    x="50"
    y="93"
    font-family="Georgia, 'Times New Roman', serif"
    font-size="12"
    font-weight="700"
    fill="white"
    text-anchor="middle"
    opacity="0.95"
    filter="url(#textShadow)"
    letter-spacing="2"
  >Gaufi</text>

</svg>