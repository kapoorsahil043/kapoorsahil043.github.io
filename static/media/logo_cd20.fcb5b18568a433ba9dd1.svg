<svg width="1024" height="1024" viewBox="0 0 100 100" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <!-- Cyan gradient -->
    <linearGradient id="bg1" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#4facfe"/>
      <stop offset="100%" stop-color="#0891b2"/>
    </linearGradient>
    <!-- Navy gradient -->
    <linearGradient id="bg2" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f1b4d"/>
      <stop offset="100%" stop-color="#2563eb"/>
    </linearGradient>
    <!-- Red-orange gradient -->
    <linearGradient id="bg3" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#be123c"/>
      <stop offset="100%" stop-color="#f97316"/>
    </linearGradient>

    <!-- Icon for cyan -->
    <linearGradient id="icon1" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0369a1"/>
      <stop offset="100%" stop-color="#075985"/>
    </linearGradient>
    <!-- Icon for navy -->
    <linearGradient id="icon2" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1e40af"/>
      <stop offset="100%" stop-color="#1d4ed8"/>
    </linearGradient>
    <!-- Icon for red-orange -->
    <linearGradient id="icon3" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#9f1239"/>
      <stop offset="100%" stop-color="#c2410c"/>
    </linearGradient>

    <!-- Gold shield -->
    <linearGradient id="shieldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fbbf24"/>
      <stop offset="100%" stop-color="#d97706"/>
    </linearGradient>

    <filter id="pinShadow">
      <feDropShadow dx="0" dy="2" stdDeviation="2" flood-color="rgba(0,0,0,0.25)"/>
    </filter>
    <filter id="shieldGlow">
      <feDropShadow dx="0" dy="0" stdDeviation="2" flood-color="#f59e0b" flood-opacity="0.8"/>
    </filter>
    <filter id="textShadow">
      <feDropShadow dx="0" dy="1" stdDeviation="1" flood-color="rgba(0,0,0,0.3)"/>
    </filter>
  </defs>

  <!-- ===================== -->
  <!-- ICON 1: CYAN          -->
  <!-- ===================== -->
  <g transform="translate(5, 5)">
    <rect width="90" height="100" rx="20" fill="url(#bg1)"/>
    <circle cx="8" cy="8" r="25" fill="rgba(255,255,255,0.08)"/>
    <!-- Pin -->
    <path d="M45 7 C31 7 19 18 19 31 C19 47 45 70 45 70 C45 70 71 47 71 31 C71 18 59 7 45 7Z"
          fill="white" opacity="0.96" filter="url(#pinShadow)"/>
    <!-- Users TL -->
    <g transform="translate(32,15)"><circle cx="0" cy="0" r="2.8" fill="url(#icon1)"/><ellipse cx="0" cy="5.8" rx="3.7" ry="2.6" fill="url(#icon1)"/></g>
    <!-- Users TR -->
    <g transform="translate(58,15)"><circle cx="0" cy="0" r="2.8" fill="url(#icon1)"/><ellipse cx="0" cy="5.8" rx="3.7" ry="2.6" fill="url(#icon1)"/></g>
    <!-- Users BL -->
    <g transform="translate(28,33)"><circle cx="0" cy="0" r="2.8" fill="url(#icon1)"/><ellipse cx="0" cy="5.8" rx="3.7" ry="2.6" fill="url(#icon1)"/></g>
    <!-- Users BR -->
    <g transform="translate(62,33)"><circle cx="0" cy="0" r="2.8" fill="url(#icon1)"/><ellipse cx="0" cy="5.8" rx="3.7" ry="2.6" fill="url(#icon1)"/></g>
    <!-- Arms -->
    <line x1="34" y1="23" x2="41" y2="27" stroke="url(#icon1)" stroke-width="2" stroke-linecap="round"/>
    <line x1="56" y1="23" x2="49" y2="27" stroke="url(#icon1)" stroke-width="2" stroke-linecap="round"/>
    <line x1="31" y1="35" x2="40" y2="30" stroke="url(#icon1)" stroke-width="2" stroke-linecap="round"/>
    <line x1="59" y1="35" x2="50" y2="30" stroke="url(#icon1)" stroke-width="2" stroke-linecap="round"/>
    <!-- Shield -->
    <path d="M45 21 C45 21 38 23.5 38 29 C38 35 41.5 38.5 45 40 C48.5 38.5 52 35 52 29 C52 23.5 45 21 45 21Z"
          fill="url(#shieldGrad)" filter="url(#shieldGlow)"/>
    <path d="M45 23 C45 23 40 25 40 29.5 C40 34 43 37 45 38.5 C47 37 50 34 50 29.5 C50 25 45 23 45 23Z"
          fill="none" stroke="rgba(255,255,255,0.3)" stroke-width="0.7"/>
    <polyline points="41.5,30 44,33 48.5,27" fill="none" stroke="white" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
    <!-- Shadow + text -->
    <ellipse cx="45" cy="72" rx="4.5" ry="1.8" fill="rgba(0,0,0,0.1)"/>
    <text x="45" y="84" font-family="Georgia,serif" font-size="10" font-weight="700"
          fill="white" text-anchor="middle" filter="url(#textShadow)" letter-spacing="1.5">Gaufi</text>
    <!-- Label -->
    <text x="45" y="96" font-family="sans-serif" font-size="6" fill="#6b7280" text-anchor="middle">Cyan</text>
  </g>


</svg>