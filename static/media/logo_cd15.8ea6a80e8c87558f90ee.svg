<svg width="1024" height="1024" viewBox="0 0 100 100" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f1b4d"/>
      <stop offset="100%" stop-color="#2563eb"/>
    </linearGradient>
    <linearGradient id="iconGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1e40af"/>
      <stop offset="100%" stop-color="#1d4ed8"/>
    </linearGradient>
    <linearGradient id="shieldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fbbf24"/>
      <stop offset="100%" stop-color="#d97706"/>
    </linearGradient>
    <filter id="pinShadow">
      <feDropShadow dx="0" dy="3" stdDeviation="3" flood-color="rgba(0,0,0,0.25)"/>
    </filter>
    <filter id="shieldGlow">
      <feDropShadow dx="0" dy="0" stdDeviation="2.5" flood-color="#f59e0b" flood-opacity="0.8"/>
    </filter>
    <filter id="textShadow">
      <feDropShadow dx="0" dy="1" stdDeviation="1.5" flood-color="rgba(0,0,0,0.25)"/>
    </filter>
  </defs>

  <!-- Background -->
  <rect width="100" height="100" rx="22" fill="url(#bgGrad)"/>
  <circle cx="10" cy="10" r="30" fill="rgba(255,255,255,0.08)"/>
  <circle cx="92" cy="92" r="24" fill="rgba(0,0,0,0.07)"/>

  <!-- Location pin -->
  <path d="M50 6 C33 6 20 19 20 34 C20 53 50 80 50 80 C50 80 80 53 80 34 C80 19 67 6 50 6Z"
        fill="white" opacity="0.96" filter="url(#pinShadow)"/>

  <!-- TOP-LEFT user -->
  <g transform="translate(36,17)">
    <circle cx="0" cy="0" r="3.2" fill="url(#iconGrad)"/>
    <ellipse cx="0" cy="6.5" rx="4.2" ry="3" fill="url(#iconGrad)"/>
  </g>

  <!-- TOP-RIGHT user -->
  <g transform="translate(64,17)">
    <circle cx="0" cy="0" r="3.2" fill="url(#iconGrad)"/>
    <ellipse cx="0" cy="6.5" rx="4.2" ry="3" fill="url(#iconGrad)"/>
  </g>

  <!-- BOTTOM-LEFT user -->
  <g transform="translate(32,38)">
    <circle cx="0" cy="0" r="3.2" fill="url(#iconGrad)"/>
    <ellipse cx="0" cy="6.5" rx="4.2" ry="3" fill="url(#iconGrad)"/>
  </g>

  <!-- BOTTOM-RIGHT user -->
  <g transform="translate(68,38)">
    <circle cx="0" cy="0" r="3.2" fill="url(#iconGrad)"/>
    <ellipse cx="0" cy="6.5" rx="4.2" ry="3" fill="url(#iconGrad)"/>
  </g>

  <!-- Connector arms -->
  <line x1="39" y1="26" x2="46" y2="31" stroke="url(#iconGrad)" stroke-width="2.2" stroke-linecap="round"/>
  <line x1="61" y1="26" x2="54" y2="31" stroke="url(#iconGrad)" stroke-width="2.2" stroke-linecap="round"/>
  <line x1="35" y1="40" x2="45" y2="35" stroke="url(#iconGrad)" stroke-width="2.2" stroke-linecap="round"/>
  <line x1="65" y1="40" x2="55" y2="35" stroke="url(#iconGrad)" stroke-width="2.2" stroke-linecap="round"/>

  <!-- Gold/Amber Shield at center (50, 34) -->
  <path d="M50 24 C50 24 42 27 42 33 C42 39.5 46 43.5 50 45.5 C54 43.5 58 39.5 58 33 C58 27 50 24 50 24Z"
        fill="url(#shieldGrad)" filter="url(#shieldGlow)"/>

  <!-- Shield inner border for depth -->
  <path d="M50 26.5 C50 26.5 44 29 44 34 C44 39 47.5 42.5 50 44 C52.5 42.5 56 39 56 34 C56 29 50 26.5 50 26.5Z"
        fill="none" stroke="rgba(255,255,255,0.3)" stroke-width="0.8"/>

  <!-- Checkmark inside shield — white bold -->
  <polyline
    points="46.5,34 49,37 53.5,30.5"
    fill="none"
    stroke="white"
    stroke-width="2.2"
    stroke-linecap="round"
    stroke-linejoin="round"
  />

  <!-- Pin tail shadow -->
  <ellipse cx="50" cy="82" rx="5" ry="2" fill="rgba(0,0,0,0.1)"/>

  <!-- Gaufi text -->
  <text
    x="50"
    y="94"
    font-family="Georgia, 'Times New Roman', serif"
    font-size="11.5"
    font-weight="700"
    fill="white"
    text-anchor="middle"
    opacity="0.96"
    filter="url(#textShadow)"
    letter-spacing="2"
  >Gaufi</text>

</svg>